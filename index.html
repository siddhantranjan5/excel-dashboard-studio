<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Excel to Dashboard Studio</title>
<script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
:root{--accent:#2F4B6E;--accent2:#8FA3BA;--bg:#F6F7F9;--card:#fff;--line:#E3E6EB;--tx:#1C2330;--mut:#6B7482;--soft:#EEF1F5;--onacc:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

header h1{font-size:16px;margin:0;font-weight:650}nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}

main{max-width:1280px;margin:0 auto;padding:22px}h2{font-size:18px;margin:0 0 4px}.mut{color:var(--mut)}.sub{margin:0 0 16px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.btn{background:var(--accent);color:var(--onacc);border:0;padding:8px 16px;border-radius:7px;cursor:pointer;font-size:13px}.btn.ghost{background:var(--card);color:var(--tx);border:1px solid var(--line)}.btn.sm{padding:4px 10px;font-size:12px}
.btn:hover{opacity:.9}select,input[type=text]{border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:13px;background:var(--card);max-width:100%}

.scroll{overflow:auto;max-height:330px}.tag{background:var(--soft);border-radius:4px;padding:1px 7px;font-size:11px;color:var(--mut)}

<header><h1>Excel to Dashboard Studio</h1><nav id="nav"></nav></header>
<main>
<section class="step" data-s="1" id="s1"><h2>1. Upload your Excel file</h2><p class="sub">Everything is processed locally in your browser. Supports .xlsx, .xls, .xlsm and .csv, with any number of worksheets.</p>
<div id="drop"><b>Drop your file here or click to browse</b><div class="mut">Each worksheet becomes a table</div><input id="file" type="file" accept=".xlsx,.xls,.xlsm,.csv" hidden></div>
<div class="row"><button class="btn ghost" onclick="loadSample()">Try with sample data (3 linked sheets)</button></div></section>
<section class="step" data-s="2" id="s2" hidden></section>
<section class="step" data-s="3" id="s3" hidden></section>
<section class="step" data-s="4" id="s4" hidden></section>
<section class="step" data-s="5" id="s5" hidden></section>
<section id="dash" hidden></section>
</main><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CF=new Intl.NumberFormat('en',{notation:'compact',maximumFractionDigits:2}),f=v=>isFinite(v)?CF.format(v):'–';
const PAL={blue:['Corporate Blue','#1F4E8C','#F2A900','#F4F6FA','#FFFFFF','#1A2233','#5F6B7D','#DDE3EC','#EAF0F9',['#1F4E8C','#4F8FD8','#9CC3EE','#F2A900','#7A8CA5','#C9D3E0'],'#fff'],
emerald:['Emerald Finance','#0B7A5A','#E0A526','#F3F8F6','#FFFFFF','#14271F','#5A6F66','#D3E5DE','#E3F1EC',['#0B7A5A','#34B38A','#8FD6BC','#E0A526','#4A6B5F','#C5D9D1'],'#fff'],
sunset:['Sunset Executive','#C2410C','#1F2937','#FBF7F3','#FFFFFF','#2A1F17','#7A6A5C','#EADBCB','#F6EADF',['#C2410C','#F08A4B','#F7C09A','#1F2937','#7C6F64','#D9CBBE'],'#fff'],
purple:['Royal Purple','#5B21B6','#14B8A6','#F7F5FC','#FFFFFF','#1F1633','#645A80','#E1DAF2','#EDE8F8',['#5B21B6','#8B5CF6','#C4B5FD','#14B8A6','#6B5E8F','#D8D1EC'],'#fff'],
crimson:['Crimson Slate','#B91C1C','#334155','#F8F6F6','#FFFFFF','#241818','#6E6060','#E7DADA','#F3E8E8',['#B91C1C','#E36B6B','#F3B5B5','#334155','#8A7A7A','#D9CFCF'],'#fff'],
dark:['Midnight Dark','#38BDF8','#FBBF24','#0F172A','#1E293B','#E2E8F0','#94A3B8','#334155','#273449',['#38BDF8','#818CF8','#34D399','#FBBF24','#F472B6','#94A3B8'],'#0F172A']};
const S={tables:{},rels:[],calcs:[],measures:[],kpiSel:[],kpiN:4,pal:'blue',cur:'none',title:'Business Dashboard',filters:{},charts:{},sel:{},step:1,loaded:false};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',5000)}
window.addEventListener('error',e=>toast('Error: '+e.message));window.addEventListener('unhandledrejection',e=>toast('Error: '+(e.reason&&e.reason.message||e.reason)));
const hexA=(h,a)=>{const n=parseInt(h.slice(1),16);return`rgba(${n>>16},${n>>8&255},${n&255},${a})`};
/* ---------- loading ---------- */
function profile(rows,cols){const o={};cols.forEach(c=>{const v=[];for(const r of rows){const x=r[c];if(x!==null&&x!==undefined&&x!=='')v.push(x)}
const n=v.length;let nu=0,dt=0;const u=new Set(),cnt=new Map();
for(const x of v){if(typeof x==='number'&&isFinite(x))nu++;else if(x instanceof Date&&!isNaN(x))dt++;const k=x instanceof Date?x.getTime():String(x);u.add(k);cnt.set(k,(cnt.get(k)||0)+1)}
const type=n&&dt/n>=.9?'date':n&&nu/n>=.9?'number':'text',ratio=n?u.size/n:0;
const idName=/(^|[\s_.\-])(id|code|key|sku|no|num|number)$/i.test(c)||/[a-z]ID$/.test(c);
const id=type!=='date'&&((idName&&ratio>.3)||(type==='text'&&n>30&&ratio>.9));
let sum='';if(type==='number'){let mn=Infinity,mx=-Infinity,s=0;for(const x of v)if(typeof x==='number'){mn=Math.min(mn,x);mx=Math.max(mx,x);s+=x}sum=`min ${f(mn)} · max ${f(mx)} · mean ${f(s/nu)}`}
else if(type==='date'){let a=Infinity,b=-Infinity;for(const x of v)if(x instanceof Date){a=Math.min(a,+x);b=Math.max(b,+x)}sum=new Date(a).toISOString().slice(0,10)+' to '+new Date(b).toISOString().slice(0,10)}
else if(n){let bk='',bv=0;cnt.forEach((q,k)=>{if(q>bv){bv=q;bk=k}});sum=`top: ${bk.slice(0,30)} (${bv}×)`}
o[c]={type,n,unique:u.size,id,key:idName&&type!=='date',sum}});return o}
function mkTable(rows){const cs=[];rows.slice(0,300).forEach(r=>Object.keys(r).forEach(k=>{if(!cs.includes(k))cs.push(k)}));const keep=cs.filter(c=>rows.some(r=>r[c]!=null&&r[c]!==''));
const cols=keep.map(c=>String(c).trim()),rr=rows.map(r=>{const o={};keep.forEach((c,i)=>o[cols[i]]=r[c]===undefined?null:r[c]);return o});return{cols,rows:rr,prof:profile(rr,cols),sets:{}}}
function autoHeader(a){const w=Math.max(0,...a.slice(0,30).map(r=>(r||[]).filter(x=>x!=null&&x!=='').length));for(let i=0;i<Math.min(a.length,30);i++){const ne=(a[i]||[]).filter(x=>x!=null&&x!=='');if(ne.length>=Math.max(1,w*.6)&&ne.filter(x=>typeof x==='string').length>=ne.length*.6)return i}return 0}
function aoaToRows(a,h){const hd=a[h]||[],mx=Math.max(hd.length,...a.slice(h+1,h+200).map(r=>(r||[]).length)),seen={},names=[];for(let j=0;j<mx;j++){let n=hd[j]==null||hd[j]===''?'Column '+(j+1):String(hd[j]).trim();if(seen[n]){seen[n]++;n+='_'+seen[n]}else seen[n]=1;names.push(n)}
const rows=[];for(let i=h+1;i<a.length;i++){const r=a[i]||[];if(!r.some(x=>x!=null&&x!==''))continue;const o={};names.forEach((n,j)=>o[n]=r[j]===undefined||r[j]===''?null:r[j]);rows.push(o)}return rows}
function loadTables(obj,raw){const T={};for(const [name,rows] of Object.entries(obj)){if(!rows||!rows.length)continue;const t=mkTable(rows);if(t.cols.length)T[name]=t}
if(!Object.keys(T).length)throw new Error('No data found in the file.');
Object.assign(S,{raw:raw||{},hdr:Object.fromEntries(Object.keys(raw||{}).map(n=>[n,autoHeader(raw[n])])),dirty:false,log:[],tables:T,calcs:[],measures:[],kpiSel:[],filters:{},range:['',''],sel:{},mInit:false,loaded:true,model:null});S.rels=detectRels();
const tr=Object.values(T).reduce((a,t)=>a+t.rows.length,0);toast(Object.keys(T).length+' worksheet(s) loaded'+(tr>150000?'. Large file ('+tr+' rows): the dashboard may be slow.':''));goStep(2)}
function loadBuffer(buf){const wb=XLSX.read(buf,{type:'array',cellDates:true}),raw={},o={};wb.SheetNames.forEach(n=>{const a=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:null,raw:true});if(a.length<2)return;a.forEach(r=>r&&r.forEach((x,i)=>{if(x instanceof Date&&!isNaN(x))r[i]=new Date(Math.round(+x/36e5)*36e5)}));raw[n]=a;o[n]=aoaToRows(a,autoHeader(a))});loadTables(o,raw)}
function handleFile(file){if(!file)return;S.src=file.name;S.sample=false;S.at=new Date().toLocaleString();const r=new FileReader();r.onload=()=>{try{loadBuffer(r.result)}catch(e){toast('Could not read file: '+e.message)}};r.onerror=()=>toast('File read failed');r.readAsArrayBuffer(file)}
function loadSample(){S.src='Built-in sample data';S.sample=true;S.at=new Date().toLocaleString();let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647,pick=a=>a[Math.floor(rnd()*a.length)];
const cat={Laptop:['Electronics',620],Phone:['Electronics',380],Headset:['Accessories',45],Monitor:['Electronics',190],Desk:['Furniture',140],Chair:['Furniture',95],Notebook:['Stationery',2],Printer:['Electronics',110]};
const Products=Object.entries(cat).map(([p,[c,u]],i)=>({ProductID:'P'+(100+i),Product:p,Category:c,UnitCost:u}));
const reg=['North','South','East','West'],seg=['Consumer','Corporate','Small Business'];
const Customers=Array.from({length:60},(_,i)=>({CustomerID:'C'+(1000+i),Customer:'Customer '+(i+1),Region:pick(reg),Segment:pick(seg)}));
const Sales=Array.from({length:900},(_,i)=>{const p=pick(Products),q=1+Math.floor(rnd()*8),d=new Date(2024,0,1+Math.floor(rnd()*640));return{OrderID:'O'+(5000+i),OrderDate:d,CustomerID:pick(Customers).CustomerID,ProductID:p.ProductID,Quantity:q,Revenue:Math.round(q*p.UnitCost*(1.15+rnd()*.7)*100)/100}});
loadTables({Sales,Customers,Products})}
/* ---------- relationships ---------- */
const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,''),keyish=s=>/id|code|key|sku|no$/i.test(s);
function vset(t,c){const T=S.tables[t];return T.sets[c]||(T.sets[c]=new Set(T.rows.map(r=>r[c]).filter(v=>v!=null).map(String)))}
function relInfo(a,ca,b,cb){const pa=S.tables[a].prof[ca],pb=S.tables[b].prof[cb];if(!pa||!pb||pa.type==='date'||pb.type==='date')return null;
const A=vset(a,ca),B=vset(b,cb),m=Math.min(A.size,B.size);if(m<2)return null;let i=0;(A.size<B.size?A:B).forEach(v=>{if((A.size<B.size?B:A).has(v))i++});const ov=i/m;if(ov<.5)return null;
const au=pa.unique===pa.n,bu=pb.unique===pb.n;let from,to,fk,pk;
if(bu&&!au){from=a;fk=ca;to=b;pk=cb}else if(au&&!bu){from=b;fk=cb;to=a;pk=ca}else if(S.tables[a].rows.length>=S.tables[b].rows.length){from=a;fk=ca;to=b;pk=cb}else{from=b;fk=cb;to=a;pk=ca}
return{id:from+'.'+fk+'>'+to+'.'+pk,from,fk,to,pk,on:true,ov}}
function detectRels(){const N=Object.keys(S.tables),out=[];for(let i=0;i<N.length;i++)for(let j=i+1;j<N.length;j++){let best=null;
S.tables[N[i]].cols.forEach(ca=>S.tables[N[j]].cols.forEach(cb=>{const x=norm(ca),y=norm(cb);if(x!==y&&!(keyish(ca)&&keyish(cb)&&(x.includes(y)||y.includes(x))))return;const r=relInfo(N[i],ca,N[j],cb);if(r&&(!best||r.ov>best.ov))best=r}));if(best)out.push(best)}return out}
function buildModel(){const N=Object.keys(S.tables);const fact=N.reduce((a,b)=>S.tables[b].rows.length>S.tables[a].rows.length?b:a);S.fact=fact;S.dupKeys=0;S.unm=0;
const nm=(t,c)=>t===fact?c:t+'.'+c;const joined=new Set([fact]),used=new Set();const cols=S.tables[fact].cols.map(c=>({name:c,table:fact,src:c}));const rows=S.tables[fact].rows.map(r=>({...r}));
let go=true;while(go){go=false;for(const r of S.rels.filter(x=>x.on)){if(used.has(r.id))continue;let have,hc,need,nc;
if(joined.has(r.from)&&!joined.has(r.to)){have=r.from;hc=r.fk;need=r.to;nc=r.pk}else if(joined.has(r.to)&&!joined.has(r.from)){have=r.to;hc=r.pk;need=r.from;nc=r.fk}else continue;
const T=S.tables[need],idx=new Map();T.rows.forEach(x=>{const k=String(x[nc]);if(!idx.has(k))idx.set(k,x);else S.dupKeys++});const hk=nm(have,hc),add=T.cols.filter(c=>c!==nc);
rows.forEach(row=>{const m=idx.get(String(row[hk]));if(!m)S.unm++;add.forEach(c=>row[nm(need,c)]=m?m[c]:null)});add.forEach(c=>cols.push({name:nm(need,c),table:need,src:c}));joined.add(need);used.add(r.id);go=true}}
S.joined=[...joined];S.base={cols,rows};S.calcs=S.calcs.filter(c=>cols.some(x=>x.name===c.a)&&(!c.b||cols.some(x=>x.name===c.b)));applyCalcs()}
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MN3=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],DOPS=['year','quarter','month','monthname','day','weekday'];
function calcVal(c,r){const a=r[c.a],dv=a instanceof Date&&!isNaN(a);
if(DOPS.includes(c.op)){if(!dv)return null;const y=a.getFullYear(),m=a.getMonth()+1;return{year:String(y),quarter:y+'-Q'+Math.ceil(m/3),month:y+'-'+String(m).padStart(2,'0'),monthname:MN3[m-1],day:String(a.getDate()).padStart(2,'0'),weekday:DN[a.getDay()]}[c.op]}
if(c.op==='concat'){const z=v=>v==null?'':v instanceof Date?v.toISOString().slice(0,10):String(v);return(z(a)+' '+z(r[c.b])).trim()||null}
if(c.op==='diffdays'){const b=r[c.b];return dv&&b instanceof Date?Math.round((a-b)/864e5):null}
if(c.op==='bucket')return typeof a!=='number'?null:a<=c._q[0]?'Low':a<=c._q[1]?'Medium':'High';
const b=r[c.b];if(typeof a!=='number'||typeof b!=='number')return null;return c.op==='+'?a+b:c.op==='-'?a-b:c.op==='*'?a*b:(b?a/b:null)}
function applyCalcs(){const rows=S.base.rows.map(r=>({...r})),ci=S.base.cols.slice();S.calcs.forEach(c=>{if(c.op==='bucket'){const v=rows.map(r=>r[c.a]).filter(x=>typeof x==='number').sort((x,y)=>x-y);c._q=[v[Math.floor(.33*(v.length-1))],v[Math.floor(.66*(v.length-1))]]}if(!ci.some(x=>x.name===c.name))ci.push({name:c.name,table:'calc',src:c.name});rows.forEach(r=>r[c.name]=calcVal(c,r))});
S.model={rows,colInfo:ci,cols:ci.map(c=>c.name)};S.prof=profile(rows,S.model.cols)}
/* ---------- DAX helpers ---------- */
function ref(n,row){const c=(S.model?S.model.colInfo:S.base.cols).find(x=>x.name===n);if(!c)return`[${n}]`;const t=c.table==='calc'?S.fact:c.table,s=`'${t}'[${c.src}]`;return row&&t!==S.fact?`RELATED(${s})`:s}
function calcDax(c){const A=ref(c.a,1),B=c.b?ref(c.b,1):'';const x={year:`YEAR(${A})`,day:`DAY(${A})`,monthname:`FORMAT(${A}, "mmm")`,weekday:`FORMAT(${A}, "ddd")`,diffdays:`DATEDIFF(${B}, ${A}, DAY)`,concat:`${A} & " " & ${B}`,bucket:`IF(${A} <= PERCENTILE.INC(ALL(${ref(c.a)}), 0.33), "Low", IF(${A} <= PERCENTILE.INC(ALL(${ref(c.a)}), 0.66), "Medium", "High"))`,month:`FORMAT(${A}, "yyyy-MM")`,quarter:`YEAR(${A}) & "-Q" & QUARTER(${A})`,'+':`${A} + ${B}`,'-':`${A} - ${B}`,'*':`${A} * ${B}`,'/':`DIVIDE(${A}, ${B})`}[c.op];return`'${S.fact}'[${c.name}] = ${x}`}
function mDax(m){const x={sum:`SUM(${ref(m.col)})`,avg:`AVERAGE(${ref(m.col)})`,count:`COUNTROWS('${S.fact}')`,dc:`DISTINCTCOUNT(${ref(m.col)})`,max:`MAX(${ref(m.col)})`,min:`MIN(${ref(m.col)})`,ratio:`DIVIDE(SUM(${ref(m.col)}), SUM(${ref(m.col2)}))`}[m.type];return`${m.name} = ${x}`}
function evalM(m,rows){const nums=c=>{const o=[];for(const r of rows){const v=r[c];if(typeof v==='number'&&isFinite(v))o.push(v)}return o},sm=a=>a.reduce((x,y)=>x+y,0);
switch(m.type){case'sum':return sm(nums(m.col));case'avg':{const a=nums(m.col);return a.length?sm(a)/a.length:0}case'count':return rows.length;
